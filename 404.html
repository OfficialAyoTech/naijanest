<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Page not found — NaijaNest</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--green:#1a6b3a;--green-dark:#155730;--text:#1a1a1a;--text-sec:#555}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f2f4f0;color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
  .card{max-width:440px;width:100%;background:#fff;border-radius:16px;padding:2.25rem 2rem;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
  .logo{font-size:18px;font-weight:700;margin-bottom:1.5rem}
  .logo span{color:var(--green)}
  h1{font-size:22px;margin-bottom:8px}
  p{font-size:14px;line-height:1.65;color:var(--text-sec);margin-bottom:1.5rem}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a.btn{padding:11px 22px;border-radius:999px;font-size:14px;font-weight:600;text-decoration:none;background:var(--green);color:#fff}
  a.btn:hover{background:var(--green-dark)}
  a.btn.alt{background:transparent;color:var(--green);border:1.5px solid var(--green)}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Naija<span>Nest</span></div>
    <h1>We can't find that page</h1>
    <p>The link may be old, or the listing may have been rented out or removed. You can search live listings from the homepage.</p>
    <div class="btns">
      <a class="btn" href="/">Find a house</a>
      <a class="btn alt" href="/contact.html">Contact support</a>
    </div>
  </div>
</body>
</html>
