<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Listings — NaijaNest</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#1a6b3a"/>
<link rel="icon" href="/icons/favicon-32.png"/>
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="NaijaNest"/>
<link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" onload="this.onload=null;this.rel='stylesheet'"/>
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/></noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/auth.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--green:#1a6b3a;--green-light:#eaf5ef;--green-mid:#b3ddc4;--green-dark:#155730;--text:#1a1a1a;--text-sec:#555;--text-muted:#888;--border:#e5e7eb;--surface:#f9fafb;--white:#fff;--radius:10px;--shadow:0 2px 12px rgba(0,0,0,0.08)}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f2f4f0;color:var(--text);min-height:100vh;padding:1.5rem 1rem}
  .container{max-width:760px;margin:0 auto}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
  .logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit}
  .logo-icon{width:30px;height:30px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center}
  .logo-icon i{color:#fff;font-size:16px}
  .logo-name{font-size:17px;font-weight:600}
  .logo-name span{color:var(--green)}
  .page-title{font-size:20px;font-weight:700;margin-bottom:4px}
  .page-sub{font-size:13px;color:var(--text-sec);margin-bottom:1.5rem}
  .add-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;background:var(--green);color:#fff;border-radius:24px;font-size:13.5px;font-weight:500;text-decoration:none;margin-bottom:1.5rem}
  .listing-card{background:#fff;border-radius:12px;padding:1rem;box-shadow:0 1px 4px rgba(0,0,0,0.06);margin-bottom:12px;display:flex;gap:12px}
  .listing-thumb{width:80px;height:80px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#e5e7eb}
  .listing-info{flex:1;min-width:0}
  .listing-name{font-size:14px;font-weight:600;margin-bottom:2px}
  .listing-meta{font-size:12px;color:var(--text-sec);margin-bottom:6px}
  .status-badge{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:500}
  .status-approved{background:#dcfce7;color:#16a34a}
  .status-rejected{background:#fee2e2;color:#dc2626}
  .status-pending{background:#fef3c7;color:#d97706}
  .empty-state, .login-gate{text-align:center;padding:3rem 1rem;color:var(--text-sec);font-size:14px}
  .login-gate button{margin-top:1rem;padding:10px 22px;background:var(--green);color:#fff;border:none;border-radius:24px;font-size:13.5px;font-weight:500;cursor:pointer}
  .feature-btn{padding:6px 12px;background:#fff;border:1px solid #d97706;color:#d97706;border-radius:20px;font-size:11.5px;font-weight:500;cursor:pointer}
  .section-title{font-size:15px;font-weight:700;margin:1.75rem 0 .5rem}
  .section-sub{font-size:12.5px;color:var(--text-sec);margin-bottom:.75rem}
  .card{background:#fff;border-radius:12px;padding:1rem;box-shadow:0 1px 4px rgba(0,0,0,0.06);margin-bottom:12px}
  .bank-form{display:flex;flex-direction:column;gap:8px}
  .bank-form select,.bank-form input{padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;font-family:inherit}
  .bank-form button{padding:9px 12px;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:13.5px;font-weight:500;cursor:pointer}
  .bank-form button:disabled{opacity:.6;cursor:default}
  .bank-saved{font-size:12.5px;color:var(--green);background:var(--green-light);border-radius:8px;padding:8px 10px;margin-bottom:8px}
  .escrow-status{font-size:12.5px;font-weight:600;margin-bottom:4px}
  .escrow-meta{font-size:11.5px;color:var(--text-sec)}
  .escrow-actions{display:flex;gap:8px;margin-top:8px}
  .escrow-actions button{flex:1;border-radius:20px;padding:7px 10px;font-size:11.5px;font-weight:500;cursor:pointer}
  .btn-confirm{background:var(--green);color:#fff;border:none}
  .btn-dispute{background:#fff;color:#dc2626;border:1px solid #dc2626}
  .receipt-btn{width:100%;margin-top:8px;background:none;border:1px solid var(--border);border-radius:20px;padding:7px 10px;font-size:11.5px;color:var(--text-sec);cursor:pointer}
  .tabs{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap}
  .tab-btn{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:12.5px;color:var(--text-sec);cursor:pointer;font-family:inherit}
  .tab-btn.active{background:var(--green);border-color:var(--green);color:#fff;font-weight:500}
  .receipt-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;align-items:center;justify-content:center;padding:1rem}
  .receipt-modal{background:#fff;border-radius:16px;padding:1.25rem;max-width:380px;width:100%;max-height:80vh;overflow-y:auto}
  .receipt-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:12.5px}
  .receipt-row span:first-child{color:var(--text-sec);flex-shrink:0}
  .receipt-row span:last-child{font-weight:600;text-align:right}
  .receipt-close{margin-top:14px;width:100%;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <a href="index.html" class="logo">
      <div class="logo-icon"><i class="ti ti-home-2"></i></div>
      <div class="logo-name">Naija<span>Nest</span></div>
    </a>
    <div id="acctBtn"></div>
  </div>

  <div class="page-title">My Listings</div>
  <div class="page-sub">Track the review status of properties you've submitted.</div>

  <div id="content">
    <div class="login-gate">
      <div>Sign in to see your listings.</div>
      <button onclick="NaijaAuth.openLoginModal()">Sign in</button>
    </div>
  </div>

  <div id="payoutSection"></div>
  <div id="escrowSection"></div>

  <div style="text-align:center;font-size:12px;color:var(--text-sec,#555);margin-top:1.5rem">Need help? <a href="contact.html" style="color:var(--green,#1a6b3a);font-weight:600;text-decoration:none">Contact support</a></div>
</div>

<script>
function fmt(n){ return '₦' + Number(n).toLocaleString(); }

let MY_PROPERTIES = [];
let currentListingsTab = 'all';

async function render(){
  const content = document.getElementById('content');
  if(!NaijaAuth.isLoggedIn()){
    content.innerHTML = `<div class="login-gate"><div>Sign in to see your listings.</div><button onclick="NaijaAuth.openLoginModal()">Sign in</button></div>`;
    return;
  }
  content.innerHTML = `<div class="empty-state">Loading...</div>`;
  try{
    const {data, error} = await NaijaAuth.client
      .from('properties')
      .select('*')
      .eq('user_id', NaijaAuth.currentUser.id)
      .order('id', {ascending:false});
    if(error) throw error;
    MY_PROPERTIES = data || [];
    renderListingsList();
  }catch(e){
    content.innerHTML = `<div class="empty-state">Could not load your listings. Please try again.</div>`;
  }
}

function selectListingsTab(tab){
  currentListingsTab = tab;
  renderListingsList();
}

// Renders from the already-fetched MY_PROPERTIES — switching tabs just
// re-filters in memory, no extra network round-trip per click.
function renderListingsList(){
  const content = document.getElementById('content');
  if(!MY_PROPERTIES.length){
    content.innerHTML = `
      <a href="list-property.html" class="add-btn"><i class="ti ti-plus"></i> List a property</a>
      <div class="empty-state">You haven't submitted any listings yet.</div>`;
    return;
  }

  const counts = {
    all: MY_PROPERTIES.length,
    approved: MY_PROPERTIES.filter(p=>p.status==='approved').length,
    pending: MY_PROPERTIES.filter(p=>p.status!=='approved' && p.status!=='rejected').length,
    rejected: MY_PROPERTIES.filter(p=>p.status==='rejected').length,
  };
  const tabDefs = [
    {key:'all', label:'All'}, {key:'approved', label:'Live'},
    {key:'pending', label:'Pending'}, {key:'rejected', label:'Rejected'},
  ];
  const tabsHtml = `<div class="tabs">${tabDefs.map(t => `
    <button class="tab-btn${currentListingsTab===t.key?' active':''}" onclick="selectListingsTab('${t.key}')">${t.label} (${counts[t.key]})</button>`).join('')}</div>`;

  const filtered = currentListingsTab === 'all' ? MY_PROPERTIES
    : currentListingsTab === 'pending' ? MY_PROPERTIES.filter(p=>p.status!=='approved' && p.status!=='rejected')
    : MY_PROPERTIES.filter(p=>p.status===currentListingsTab);

  const listHtml = !filtered.length
    ? `<div class="empty-state">No listings in this category.</div>`
    : filtered.map(p => {
        const isFeatured = p.featured && p.featured_until && new Date(p.featured_until) > new Date();
        return `
        <div class="listing-card">
          <img class="listing-thumb" src="${(p.photo_urls&&p.photo_urls[0])||''}" loading="lazy" decoding="async" onerror="this.style.background='#e5e7eb'"/>
          <div class="listing-info">
            <div class="listing-name">${escapeHtml(p.name)} ${isFeatured ? '<span style="font-size:11px;color:#d97706">⭐ Featured</span>' : ''}</div>
            <div class="listing-meta">${escapeHtml(p.area)}${p.lga?', '+escapeHtml(p.lga):''}, ${escapeHtml(p.city)} · ${fmt(p.price)}/yr</div>
            <span class="status-badge status-${p.status}">${p.status === 'approved' ? '✅ Live' : p.status === 'rejected' ? '❌ Rejected' : '⏳ Pending review'}</span>
            ${p.status==='approved' && !isFeatured ? `<div style="margin-top:8px"><button class="feature-btn" data-id="${p.id}" onclick="featureListing(${p.id})">⭐ Feature this listing — ₦5,000/30 days</button></div>` : ''}
            ${isFeatured ? `<div style="font-size:11px;color:#666;margin-top:4px">Featured until ${new Date(p.featured_until).toLocaleDateString()}</div>` : ''}
          </div>
        </div>`;
      }).join('');

  content.innerHTML = `<a href="list-property.html" class="add-btn"><i class="ti ti-plus"></i> List another property</a>
    <div id="paymentBanner"></div>
    ${tabsHtml}
    ${listHtml}`;
}

async function featureListing(propertyId){
  const btn = document.querySelector(`.feature-btn[data-id="${propertyId}"]`);
  if(btn){ btn.disabled = true; btn.textContent = 'Starting payment...'; }
  try{
    const access_token = await NaijaAuth.getAccessToken();
    const resp = await fetch('/api/paystack-initialize', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ property_id: propertyId, access_token })
    });
    const data = await resp.json();
    if(!data.authorization_url) throw new Error(data.error || 'Could not start payment');
    window.location.href = data.authorization_url;
  }catch(e){
    alert('Could not start payment: ' + e.message);
    if(btn){ btn.disabled = false; btn.textContent = '⭐ Feature this listing — ₦5,000/30 days'; }
  }
}

async function checkPaymentReturn(){
  const params = new URLSearchParams(window.location.search);
  const reference = params.get('reference') || params.get('trxref');
  if(!reference) return;
  history.replaceState(null, '', window.location.pathname);
  const banner = document.getElementById('paymentBanner');
  if(banner) banner.innerHTML = `<div style="background:#fef3c7;color:#92400e;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px">Confirming payment...</div>`;
  try{
    const resp = await fetch(`/api/paystack-verify?reference=${encodeURIComponent(reference)}`);
    const data = await resp.json();
    const isRentEscrow = !!data.escrow_id; // present only on the rent_escrow branch of verify
    if(data.success){
      const msg = isRentEscrow
        ? '✅ Payment successful — held securely and released to the landlord automatically within a couple of hours (or right away if you confirm move-in).'
        : '✅ Payment successful — your listing is now featured!';
      if(banner) banner.innerHTML = `<div style="background:#dcfce7;color:#16a34a;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px">${msg}</div>`;
    } else {
      if(banner) banner.innerHTML = `<div style="background:#fee2e2;color:#dc2626;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px">❌ ${escapeHtml(data.error||'Payment was not completed')}</div>`;
    }
    await render();
    await renderEscrowSection();
  }catch(e){
    if(banner) banner.innerHTML = `<div style="background:#fee2e2;color:#dc2626;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px">Could not confirm payment — contact support if you were charged.</div>`;
  }
}

// ---- Payout details (landlord bank account for rent payouts) ----
async function renderPayoutSection(){
  const el = document.getElementById('payoutSection');
  if(!el) return;
  if(!NaijaAuth.isLoggedIn()){ el.innerHTML = ''; return; }

  let profile = null;
  try{
    const {data} = await NaijaAuth.client.from('profiles')
      .select('bank_code,bank_name,bank_account_number,bank_account_name')
      .eq('id', NaijaAuth.currentUser.id).maybeSingle();
    profile = data;
  }catch(e){}

  const saved = profile && profile.bank_account_number
    ? `<div class="bank-saved">✅ Payouts go to ${escapeHtml(profile.bank_account_name||'')} — ${escapeHtml(profile.bank_name||'')} ****${escapeHtml(String(profile.bank_account_number).slice(-4))}</div>`
    : `<div class="section-sub">Add your bank account so rent payments can be paid out to you once a tenant confirms move-in.</div>`;

  el.innerHTML = `
    <div class="section-title">Payout details</div>
    <div class="card">
      ${saved}
      <div class="bank-form">
        <select id="bankSelect"><option value="">Loading banks...</option></select>
        <input id="bankAccountNumber" placeholder="10-digit account number" maxlength="10" inputmode="numeric"/>
        <button id="saveBankBtn" onclick="saveBankDetails()">Verify & Save</button>
        <div id="bankResult" style="font-size:12px"></div>
      </div>
    </div>`;

  try{
    const resp = await fetch('/api/paystack-verify?list_banks=1');
    const data = await resp.json();
    const sel = document.getElementById('bankSelect');
    if(sel && data.banks){
      sel.innerHTML = '<option value="">Select your bank</option>' +
        data.banks.map(b => `<option value="${b.code}" ${profile && profile.bank_code===b.code ? 'selected' : ''}>${escapeHtml(b.name)}</option>`).join('');
    }
  }catch(e){
    const sel = document.getElementById('bankSelect');
    if(sel) sel.innerHTML = '<option value="">Could not load banks — refresh to try again</option>';
  }
}

async function saveBankDetails(){
  const btn = document.getElementById('saveBankBtn');
  const sel = document.getElementById('bankSelect');
  const bankCode = sel.value;
  const bankName = sel.selectedOptions[0] ? sel.selectedOptions[0].textContent : '';
  const accountNumber = document.getElementById('bankAccountNumber').value.trim();
  const resultEl = document.getElementById('bankResult');
  if(!bankCode || !accountNumber){
    resultEl.style.color = '#dc2626';
    resultEl.textContent = 'Select a bank and enter your account number.';
    return;
  }
  btn.disabled = true; btn.textContent = 'Verifying...';
  resultEl.textContent = '';
  try{
    const access_token = await NaijaAuth.getAccessToken();
    const resp = await fetch('/api/paystack-verify', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action: 'save_bank_details', access_token, bank_code: bankCode, bank_name: bankName, account_number: accountNumber })
    });
    const data = await resp.json();
    if(!data.success) throw new Error(data.error || 'Could not verify account');
    resultEl.style.color = 'var(--green)';
    resultEl.textContent = `✅ Verified: ${data.account_name}`;
    await renderPayoutSection();
  }catch(e){
    resultEl.style.color = '#dc2626';
    resultEl.textContent = e.message;
  }finally{
    btn.disabled = false; btn.textContent = 'Verify & Save';
  }
}

// ---- Rent payments (both sides: paid as renter, received as landlord) ----

// Formats how long is left until confirm_deadline, in hours/minutes — the
// release buffer is now short (a couple of hours for basic fraud/payment
// checks), not the old multi-day window, so a "days left" countdown would
// misleadingly show 0 for almost the entire wait. No one needs to do
// anything for this to release; this is purely informational.
function timeUntilRelease(deadlineIso){
  if(!deadlineIso) return null;
  const msLeft = new Date(deadlineIso) - new Date();
  if(msLeft <= 0) return 'any moment now';
  const totalMins = Math.ceil(msLeft / 60000);
  const hrs = Math.floor(totalMins / 60);
  const mins = totalMins % 60;
  if(hrs > 0) return `${hrs}h ${mins}m`;
  return `${mins}m`;
}

function escrowStatusLabel(row){
  const timeLeft = timeUntilRelease(row.confirm_deadline);
  switch(row.status){
    case 'pending_payment': return {text:'⏳ Payment pending', color:'#d97706'};
    case 'funded': return {text:`✅ Held in escrow${timeLeft?` — auto-releases in ${timeLeft}`:''}`, color:'#1a6b3a'};
    case 'confirmed': return {text:'✅ Confirmed — payout processing', color:'#1a6b3a'};
    case 'disputed': return {text:'🚩 Disputed — under review', color:'#dc2626'};
    case 'released': return {text:'✅ Released to landlord', color:'#1a6b3a'};
    case 'refunded': return {text:'↩️ Refunded', color:'#555'};
    case 'payment_failed': return {text:'❌ Payment failed', color:'#dc2626'};
    default: return {text: row.status, color:'#555'};
  }
}

async function renderEscrowSection(){
  const el = document.getElementById('escrowSection');
  if(!el) return;
  if(!NaijaAuth.isLoggedIn()){ el.innerHTML = ''; return; }

  let rows = [];
  try{
    const access_token = await NaijaAuth.getAccessToken();
    const resp = await fetch('/api/paystack-verify', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action: 'my_escrow', access_token })
    });
    const data = await resp.json();
    rows = data.escrow || [];
    window.__myUserId = data.user_id;
  }catch(e){}

  ESCROW_ROWS = rows; // cached so the receipt modal doesn't need a second fetch
  if(!rows.length){ el.innerHTML = ''; return; }

  const paid = rows.filter(r => r.renter_id === window.__myUserId);
  const received = rows.filter(r => r.landlord_id === window.__myUserId);

  // A receipt only makes sense once a payment actually succeeded — nothing
  // to show for a row still stuck at pending_payment or that never went through.
  const hasReceipt = r => !['pending_payment','payment_failed'].includes(r.status);

  const rowHtml = (r, isRenter) => {
    const {text, color} = escrowStatusLabel(r);
    const actions = (isRenter && r.status === 'funded') ? `
      <div class="escrow-actions">
        <button class="btn-confirm" onclick="mlConfirmMoveIn('${r.id}')">✅ Confirm move-in</button>
        <button class="btn-dispute" onclick="mlRaiseDispute('${r.id}')">🚩 Report a problem</button>
      </div>` : '';
    const receiptBtn = hasReceipt(r)
      ? `<button class="receipt-btn" onclick="openMlReceipt('${r.id}')">🧾 View Payment Receipt</button>` : '';
    return `<div class="card">
      <div class="escrow-status" style="color:${color}">${text}</div>
      <div class="escrow-meta">${fmt(r.total_amount / 100)} total · ${new Date(r.created_at).toLocaleDateString()}</div>
      ${actions}
      ${receiptBtn}
    </div>`;
  };

  el.innerHTML = `
    ${paid.length ? `<div class="section-title">Rent payments I've made</div>${paid.map(r=>rowHtml(r,true)).join('')}` : ''}
    ${received.length ? `<div class="section-title">Rent payments received</div>${received.map(r=>rowHtml(r,false)).join('')}` : ''}
  `;
}

// ---- Payment receipt modal (works for both sides: paid or received) ----
let ESCROW_ROWS = [];

function ensureReceiptModal(){
  if(document.getElementById('mlReceiptOverlay')) return;
  const wrap = document.createElement('div');
  wrap.id = 'mlReceiptOverlay';
  wrap.className = 'receipt-modal-overlay';
  wrap.innerHTML = `<div class="receipt-modal" id="mlReceiptBody"></div>`;
  wrap.addEventListener('click', (e) => { if(e.target === wrap) closeMlReceipt(); });
  document.body.appendChild(wrap);
}

async function openMlReceipt(escrowId){
  ensureReceiptModal();
  const row = ESCROW_ROWS.find(r => String(r.id) === String(escrowId));
  if(!row){ alert('Could not find this payment record.'); return; }

  const body = document.getElementById('mlReceiptBody');
  body.innerHTML = `<div style="text-align:center;padding:1rem;color:var(--text-sec);font-size:13px">Loading...</div>`;
  document.getElementById('mlReceiptOverlay').style.display = 'flex';

  let propLabel = `Property #${row.property_id}`;
  try{
    const {data} = await NaijaAuth.client.from('properties').select('name,area,city').eq('id', row.property_id).maybeSingle();
    if(data) propLabel = `${data.name} — ${data.area}, ${data.city}`;
  }catch(e){}

  const statusLabels = {
    pending_payment:'Payment pending', funded:'Held in escrow', confirmed:'Move-in confirmed',
    disputed:'Under dispute review', released:'Released to landlord', refunded:'Refunded to tenant',
    payment_failed:'Payment failed',
  };
  const infoRows = [
    ['Reference', row.reference],
    ['Property', propLabel],
    ['Status', statusLabels[row.status] || row.status],
    ['Paid on', row.created_at ? new Date(row.created_at).toLocaleString() : '—'],
  ];
  if(row.confirmed_at) infoRows.push(['Move-in confirmed', new Date(row.confirmed_at).toLocaleString()]);
  if(row.released_at) infoRows.push(['Released to landlord', new Date(row.released_at).toLocaleString()]);
  if(row.refunded_at) infoRows.push(['Refunded', new Date(row.refunded_at).toLocaleString()]);

  const breakdown = [
    ['Rent', row.rent_amount],
    ['Agency fee', row.agency_fee_amount],
    ['Legal fee', row.legal_fee_amount],
    ['Caution fee (refundable)', row.caution_fee_amount],
    ['NaijaNest platform fee', row.platform_fee_amount],
  ].filter(([,amt]) => amt != null && amt > 0);

  body.innerHTML = `
    <div style="font-size:15px;font-weight:700;margin-bottom:12px">🧾 Payment Receipt</div>
    <div style="background:var(--surface);border-radius:10px;padding:12px;margin-bottom:12px">
      ${infoRows.map(([label,val]) => `<div class="receipt-row"><span>${label}</span><span>${escapeHtml(String(val))}</span></div>`).join('')}
    </div>
    <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Amount breakdown</div>
    <div style="background:var(--surface);border-radius:10px;padding:12px">
      ${breakdown.map(([label,amt]) => `<div class="receipt-row"><span>${label}</span><span>${fmt(amt/100)}</span></div>`).join('')}
      <div class="receipt-row" style="border-top:1px solid var(--border);padding-top:8px;margin-top:4px"><span style="font-weight:700;color:var(--text)">Total</span><span style="color:var(--green)">${fmt((row.total_amount||0)/100)}</span></div>
    </div>
    <button class="receipt-close" onclick="closeMlReceipt()">Close</button>
  `;
}

function closeMlReceipt(){
  const el = document.getElementById('mlReceiptOverlay');
  if(el) el.style.display = 'none';
}

async function mlConfirmMoveIn(escrowId){
  if(!confirm('Confirm you have received the keys and moved in? This releases payment to the landlord right away.')) return;
  try{
    const access_token = await NaijaAuth.getAccessToken();
    const resp = await fetch('/api/paystack-verify', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action: 'confirm_move_in', escrow_id: escrowId, access_token })
    });
    const data = await resp.json();
    if(!data.success) throw new Error(data.error || 'Could not confirm');
    await renderEscrowSection();
  }catch(e){ alert('Could not confirm move-in: ' + e.message); }
}

async function mlRaiseDispute(escrowId){
  const reason = prompt("What went wrong? This freezes the payment and NaijaNest support will review it.");
  if(!reason || !reason.trim()) return;
  try{
    const access_token = await NaijaAuth.getAccessToken();
    const resp = await fetch('/api/paystack-verify', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action: 'raise_dispute', escrow_id: escrowId, access_token, reason: reason.trim() })
    });
    const data = await resp.json();
    if(!data.success) throw new Error(data.error || 'Could not submit report');
    await renderEscrowSection();
    alert('Reported. Our team will review and reach out.');
  }catch(e){ alert('Could not submit report: ' + e.message); }
}

function escapeHtml(str){
  if(str===null||str===undefined) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function init(){
  NaijaAuth.renderAccountButton(document.getElementById('acctBtn'));
  NaijaAuth.onChange(()=>{ render(); renderPayoutSection(); renderEscrowSection(); });
  render();
  renderPayoutSection();
  renderEscrowSection().then(checkPaymentReturn);
}
document.addEventListener('DOMContentLoaded', init);
if(document.readyState !== 'loading') init();

// ---- PWA: service worker ----
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
</script>
