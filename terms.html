<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-13Q50128K9"></script>

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-13Q50128K9');

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Terms of Use — NaijaNest</title>
<meta name="description" content="The rules for using NaijaNest: listing, renting, payments, disputes and what we expect from everyone on the platform."/>
<link rel="canonical" href="https://naijanestai.com.ng/terms.html"/>
<link rel="icon" href="/icons/favicon-32.png"/>
<link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" onload="this.onload=null;this.rel='stylesheet'"/>
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/></noscript>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--green:#1a6b3a;--green-light:#eaf5ef;--text:#1a1a1a;--text-sec:#555;--surface:#f9fafb}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f2f4f0;color:var(--text);min-height:100vh;padding:1.5rem 1rem}
  .container{max-width:760px;margin:0 auto;background:#fff;border-radius:16px;padding:2rem 2.25rem;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
  .logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;margin-bottom:1.5rem}
  .logo-icon{width:30px;height:30px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center}
  .logo-icon i{color:#fff;font-size:16px}
  .logo-name{font-size:17px;font-weight:600}
  .logo-name span{color:var(--green)}
  h1{font-size:22px;margin-bottom:6px}
  .updated{font-size:12.5px;color:var(--text-sec);margin-bottom:1.5rem}
  h2{font-size:15px;margin:1.75rem 0 8px;color:var(--green)}
  p,li{font-size:14px;line-height:1.7;color:#333}
  p{margin-bottom:8px}
  ul,ol{margin:0 0 .5rem 1.2rem}
  a{color:var(--green)}
  .callout{background:var(--surface);border-left:3px solid var(--green);border-radius:8px;padding:10px 14px;margin:1rem 0;font-size:13.5px;line-height:1.7}
  @media (max-width:480px){.container{padding:1.5rem 1.25rem}}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/auth.js"></script>
<div class="container">
  <a href="index.html" class="logo">
    <div class="logo-icon"><i class="ti ti-home-2"></i></div>
    <div class="logo-name">Naija<span>Nest</span></div>
  </a>
  <h1>Terms of Use</h1>
  <div class="updated" id="updatedLine">Last updated: October 2026</div>
  <div id="termsContent"><p>Loading…</p></div>
</div>
<script>
  // Same lightweight markup as the Payment and Privacy policy editors:
  // ## heading, - bullet, 1. numbered, > callout, **bold**, [text](url).
  // Everything else is escaped, so edited text can never inject HTML or script.
  function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
  function inline(s){
    return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,t,u)=>/^(https?:|mailto:|[\w\-./#?=&]+$)/.test(u)?'<a href="'+u+'">'+t+'</a>':t);
  }
  function render(text){
    const lines=String(text||'').replace(/\r\n/g,'\n').split('\n');
    let html='',i=0,para=[];
    const flush=()=>{if(para.length){html+='<p>'+inline(para.join(' '))+'</p>';para=[];}};
    while(i<lines.length){
      const t=lines[i].trim();
      if(!t){flush();i++;continue;}
      if(t.startsWith('## ')){flush();html+='<h2>'+inline(t.slice(3))+'</h2>';i++;continue;}
      if(t.startsWith('> ')){flush();const b=[];while(i<lines.length&&lines[i].trim().startsWith('> ')){b.push(lines[i].trim().slice(2));i++;}html+='<div class="callout">'+inline(b.join(' '))+'</div>';continue;}
      if(t.startsWith('- ')){flush();const it=[];while(i<lines.length&&lines[i].trim().startsWith('- ')){it.push(lines[i].trim().slice(2));i++;}html+='<ul>'+it.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ul>';continue;}
      if(/^\d+\.\s/.test(t)){flush();const it=[];while(i<lines.length&&/^\d+\.\s/.test(lines[i].trim())){it.push(lines[i].trim().replace(/^\d+\.\s/,''));i++;}html+='<ol>'+it.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ol>';continue;}
      para.push(t);i++;
    }
    flush();return html;
  }
  (async function(){
    const box=document.getElementById('termsContent');
    let text=null,updated=null;
    try{
      if(window.NaijaAuth&&NaijaAuth.client){
        const {data}=await NaijaAuth.client.from('site_content').select('html,updated_at').eq('key','terms_of_use').maybeSingle();
        if(data&&data.html){text=data.html;updated=data.updated_at;}
      }
    }catch(e){}
    if(!text){
      try{const r=await fetch('/terms-default.txt');if(r.ok)text=await r.text();}catch(e){}
    }
    if(!text){box.innerHTML='<p>We could not load this page right now. Please try again, or email <a href="mailto:support@naijanestai.com.ng">support@naijanestai.com.ng</a>.</p>';return;}
    box.innerHTML=render(text);
    if(updated){const d=new Date(updated);document.getElementById('updatedLine').textContent='Last updated: '+String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
  })();
</script>
</body>
</html>
