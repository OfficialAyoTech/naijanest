<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Contact Support — NaijaNest</title>
<link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" onload="this.onload=null;this.rel='stylesheet'"/>
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/></noscript>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--green:#1a6b3a;--green-light:#eaf5ef;--green-mid:#b3ddc4;--green-dark:#155730;--text:#1a1a1a;--text-sec:#555;--text-muted:#888;--border:#e5e7eb;--surface:#f9fafb;--white:#fff;--radius:10px;--shadow:0 2px 12px rgba(0,0,0,0.08)}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f2f4f0;color:var(--text);min-height:100vh;padding:1.5rem 1rem}
  .container{max-width:560px;margin:0 auto;background:#fff;border-radius:16px;padding:2rem 2.25rem;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
  .logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;margin-bottom:1.5rem}
  .logo-icon{width:30px;height:30px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center}
  .logo-icon i{color:#fff;font-size:16px}
  .logo-name{font-size:17px;font-weight:600}
  .logo-name span{color:var(--green)}
  h1{font-size:22px;margin-bottom:6px}
  .sub{font-size:13.5px;color:var(--text-sec);margin-bottom:1.5rem;line-height:1.6}
  .email-line{font-size:13.5px;margin-bottom:1.75rem;padding:10px 12px;background:var(--surface);border-radius:var(--radius);border-left:3px solid var(--green)}
  .email-line a{color:var(--green);font-weight:600;text-decoration:none}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;color:var(--text-sec);margin-bottom:5px;font-weight:500}
  .field input,.field textarea{width:100%;padding:10px 12px;border:0.5px solid var(--border);border-radius:var(--radius);font-size:13.5px;background:var(--surface);color:var(--text);outline:none;transition:border-color .15s;font-family:inherit}
  .field textarea{min-height:110px;resize:vertical}
  .field input:focus,.field textarea:focus{border-color:var(--green)}
  .submit-btn{width:100%;padding:12px;background:var(--green);color:#fff;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;transition:background .15s}
  .submit-btn:disabled{opacity:0.6;cursor:default}
  .success-box{display:none;text-align:center;padding:2rem 0}
  .success-box i{font-size:40px;color:var(--green);margin-bottom:10px}
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="logo">
    <div class="logo-icon"><i class="ti ti-home-2"></i></div>
    <div class="logo-name">Naija<span>Nest</span></div>
  </a>

  <h1>Contact Support</h1>
  <div class="sub">Question, complaint, or something not working right? Reach out &mdash; we read every message.</div>

  <div class="email-line">Prefer email? Write to us directly at <a href="mailto:support@naijanest.com">support@naijanest.com</a> <button type="button" id="copyEmailBtn" onclick="copySupportEmail()" style="border:none;background:none;color:var(--green);font-size:11.5px;font-weight:600;cursor:pointer;text-decoration:underline;padding:0;margin-left:4px">copy</button></div>

  <div id="formCard">
    <div class="field">
      <label>Your name (optional)</label>
      <input type="text" id="cName" placeholder="e.g. Chukwuemeka Obi"/>
    </div>
    <div class="field">
      <label>Email or phone number, so we can reach you back</label>
      <input type="text" id="cContact" placeholder="you@email.com or 08012345678"/>
    </div>
    <div class="field">
      <label>What is going on?</label>
      <textarea id="cMessage" placeholder="Tell us what happened, or what you need help with..."></textarea>
    </div>
    <button class="submit-btn" id="submitBtn" onclick="submitContact()">Send message</button>
  </div>

  <div class="success-box" id="successBox">
    <i class="ti ti-circle-check"></i>
    <div style="font-weight:600;font-size:15px;margin-bottom:4px">Message sent</div>
    <div style="font-size:13px;color:var(--text-sec)">Our team will get back to you soon.</div>
  </div>
</div>

<script>
// The mailto: link above only works if the visitor's browser/OS has a
// default mail app registered — not a safe assumption on desktop. This is
// the fallback: copy the address so they can paste it into whatever email
// app they actually use.
function copySupportEmail() {
  const email = 'support@naijanest.com';
  const btn = document.getElementById('copyEmailBtn');
  navigator.clipboard.writeText(email).then(() => {
    const original = btn.textContent;
    btn.textContent = 'copied!';
    setTimeout(() => { btn.textContent = original; }, 1500);
  }).catch(() => {
    alert('Could not copy automatically — the address is: ' + email);
  });
}

async function submitContact() {
  const name = document.getElementById('cName').value.trim();
  const contact = document.getElementById('cContact').value.trim();
  const message = document.getElementById('cMessage').value.trim();

  if (!contact) { alert('Please share an email or phone number so we can reach you back.'); return; }
  if (!message) { alert('Please tell us what is going on.'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Sending...';

  try {
    const resp = await fetch('/api/submit-property', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'contact_support', name, contact, message })
    });
    const data = await resp.json();
    if (!data.success) throw new Error(data.error || 'Something went wrong');
    document.getElementById('formCard').style.display = 'none';
    document.getElementById('successBox').style.display = 'block';
  } catch (e) {
    alert('Could not send your message: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Send message';
  }
}
</script>
</body>
</html>
